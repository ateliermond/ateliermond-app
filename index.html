<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F7F4F4;font-family:'DM Sans',sans-serif;color:#2E2621;font-size:14px}
input,select,textarea{font-family:inherit;font-size:13px;color:#2E2621;outline:none}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* Layout */
#header{background:#2E2621;padding:20px 24px 0}
#header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:16px}
#nav{display:flex;border-top:1px solid #3A3028}
.nav-btn{padding:12px 20px;border:none;background:none;color:#8A8480;font-size:12px;letter-spacing:1px;border-bottom:2px solid transparent;transition:color .2s}
.nav-btn.active{color:#F7F4F4;border-bottom-color:#C4BEBA}
#content{padding:18px 24px}

/* Cards */
.card{background:#fff;border:1px solid #DDD9D5;border-radius:8px;margin-bottom:10px;overflow:hidden}
.card-header{padding:13px 15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* Inputs */
.inp{padding:7px 10px;border:1px solid #DDD9D5;border-radius:5px;background:#F7F4F4;width:100%}
.inp:focus{border-color:#8A8480}
.inp-inline{padding:4px 8px;border:1px solid #DDD9D5;border-radius:4px;background:#F7F4F4}

/* Buttons */
.btn{padding:5px 10px;border:1px solid #DDD9D5;border-radius:4px;background:none;color:#8A8480;font-size:12px}
.btn:hover{background:#F7F4F4}
.btn-danger{color:#9B4030}
.btn-primary{padding:8px 18px;border:none;background:#2E2621;color:#F7F4F4;border-radius:6px;font-size:12px;letter-spacing:1px}
.btn-sec{padding:8px 14px;border:1px solid #DDD9D5;background:none;color:#8A8480;border-radius:6px;font-size:12px}
.btn-dashed{padding:5px 14px;border:1px dashed #C4BEBA;background:none;color:#8A8480;border-radius:5px;font-size:12px}

/* Badges */
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;white-space:nowrap;border:1px solid currentColor}

/* Progress */
.pbar-wrap{width:72px;height:4px;background:#DDD9D5;border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle}
.pbar-fill{height:4px;border-radius:2px;transition:width .4s}

/* Sync dot */
#sync-dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#4A7C5E;vertical-align:middle;margin-right:4px}

/* Stats bar */
.stats-bar{background:#fff;border-bottom:1px solid #DDD9D5;padding:12px 24px;display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.stat{text-align:center}
.stat-val{font-size:20px;font-weight:300;line-height:1}
.stat-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#8A8480;margin-top:2px}

/* Stage tabs */
#stage-tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid #DDD9D5;padding:0 20px}
.stage-tab{padding:10px 13px;border:none;background:none;color:#8A8480;font-size:11px;white-space:nowrap;border-bottom:2px solid transparent;cursor:pointer}
.stage-tab.active{color:#2E2621;font-weight:600;border-bottom-color:#2E2621}

/* Expanded section */
.expanded{border-top:1px solid #F7F4F4;padding:14px 15px}

/* Timeline */
.timeline{background:#F7F4F4;border:1px solid #DDD9D5;border-radius:8px;padding:12px 14px;margin-top:12px}
.tl-cells{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.tl-cell{flex:1 1 70px;text-align:center}
.tl-date{font-size:11px;font-weight:600;padding:3px 2px;border-radius:4px;border:1px solid #DDD9D5;background:#fff;display:block}

/* Oven */
.oven-col{flex:1;min-width:250px}
.batch-card{background:#fff;border:1px solid #DDD9D5;border-left:3px solid #7A5C3A;border-radius:8px;padding:13px 14px;margin-bottom:10px}
.seg-bar{height:8px;background:#F7F4F4;border-radius:4px;overflow:hidden;display:flex;gap:1px;margin-bottom:4px}

/* Kurs */
.kurs-card{background:#fff;border:1px solid #DDD9D5;border-left:3px solid #2E2621;border-radius:8px;margin-bottom:10px;overflow:hidden}
.kurs-header{padding:12px 15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kurs-expanded{border-top:1px solid #F7F4F4;padding:13px 15px}
.tn-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fff;border:1px solid #DDD9D5;border-radius:6px;margin-bottom:5px;flex-wrap:wrap}

/* Settings panel */
#settings-overlay{position:fixed;inset:0;background:rgba(46,38,33,.5);z-index:200;display:flex;justify-content:flex-end}
#settings-panel{background:#fff;width:340px;height:100vh;display:flex;flex-direction:column}
#settings-body{flex:1;overflow-y:auto;padding:28px}
#settings-footer{border-top:1px solid #DDD9D5;padding:16px 28px;display:flex;gap:10px}

/* Form */
.form-box{background:#fff;border:1px solid #DDD9D5;border-radius:10px;padding:22px;margin-bottom:14px}
.form-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.prod-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid #F7F4F4}

/* Misc */
.lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8A8480;font-weight:500}
.sep{flex:1}
.flex{display:flex}
.gap8{gap:8px}
.mt8{margin-top:8px}
.mt12{margin-top:12px}
.italic{font-style:italic}
.red{color:#9B4030}
.green{color:#4A7C5E}
</style>
</head>

  {id:"konfektionierung",label:"Konfektionierung",short:"Konf.",days:1,oven:false}
];
var SIZES = {XS:0.5,S:1,M:1.5,L:2,XL:3};
var COLS = ["#8C6E50","#5C8070","#506E8C","#7A5870","#8C7A50","#6E7A50","#7A506E"];
var today = new Date().toISOString().split("T")[0];
var uidc = Date.now();
function uid(){return "id"+(uidc++);}

// ── SUPABASE ──────────────────────────────────────────
function sbFetch(path, opts) {
  opts = opts || {};
  var fetchOpts = {
    method: opts.method || "GET",
    headers: {
      "apikey": SB_ANON,
      "Authorization": "Bearer " + SB_ANON,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || ""
    }
  };
  if(opts.body) fetchOpts.body = opts.body;
  return fetch(SB_URL + path, fetchOpts).then(function(r){
    return r.text().then(function(t){
      if(!r.ok) throw new Error("HTTP "+r.status+": "+(t||"Fehler"));
      return t ? JSON.parse(t) : null;
    });
  });
}

function loadAll() {
  return sbFetch("/rest/v1/orders?select=*&order=updated_at.asc").then(function(rows){
    if(!rows) rows = [];
    var settRow = null;
    var orders = [];
    var kurse = [];
    rows.forEach(function(r){
      if(!r.data) return;
      if(r.data._type === "settings"){settRow = r;}
      else if(r.data._type === "kurs"){kurse.push(Object.assign({},r.data,{_dbId:r.id}));}
      else {orders.push(Object.assign({},r.data,{_dbId:r.id}));}
    });
    return {orders:orders, kurse:kurse, settings:settRow?settRow.data:null, settingsDbId:settRow?settRow.id:null};
  });
}

function saveRow(data, dbId) {
  var body = JSON.stringify({data:data, updated_at:new Date().toISOString()});
  if(dbId){
    return sbFetch("/rest/v1/orders?id=eq."+dbId, {method:"PATCH", prefer:"return=minimal", body:body}).then(function(){return dbId;});
  }
  return sbFetch("/rest/v1/orders", {method:"POST", prefer:"return=representation", body:body}).then(function(r){return r[0].id;});
}

function delRow(dbId){
  return sbFetch("/rest/v1/orders?id=eq."+dbId, {method:"DELETE"});
}

// ── SYNC ──────────────────────────────────────────────
function setSyncStatus(s){
  state.syncStatus = s;
}

function load(){
  setSyncStatus("loading");
  loadAll().then(function(d){
    if(d.orders && d.orders.length) state.orders = d.orders;
    if(d.kurse && d.kurse.length) state.kurse = d.kurse;
    if(d.settings) state.settings = Object.assign({},state.settings,d.settings);
    if(d.settingsDbId) state.settingsDbId = d.settingsDbId;
    setSyncStatus("idle");
    render();
  }).catch(function(e){
    console.error("Supabase Fehler:", e);
    setSyncStatus("error");
    state.loadError = e.message || "Verbindung fehlgeschlagen";
    render();
  });
}

function persist(data, dbId){
  setSyncStatus("saving");
  return saveRow(data, dbId).then(function(id){setSyncStatus("idle");return id;}).catch(function(e){setSyncStatus("error");return dbId;});
}

// ── HELPERS ───────────────────────────────────────────
function sidx(id){for(var i=0;i<STAGES.length;i++){if(STAGES[i].id===id)return i;}return 0;}
function subDays(d,n){var dt=new Date(d);dt.setDate(dt.getDate()-n);return dt.toISOString().split("T")[0];}
function calcDL(delivery){
  var map={}, c=delivery;
  var st=STAGES.map(function(s){return s.id==="trocknung"?Object.assign({},s,{days:state.settings.trocknungDays}):s;});
  for(var i=st.length-1;i>=0;i--){c=subDays(c,st[i].days);map[st[i].id]=c;}
  return map;
}
function ovenUnits(p){var s=(p.groesse||"M").toUpperCase();return p.qty*(SIZES[s]||SIZES.M);}
function orderProgress(order){
  if(!order||!order.products||!order.products.length)return 0;
  var t=order.products.length;
  var s=0;
  order.products.forEach(function(p){if(p.done)s+=1;else s+=sidx(p.stage)/(STAGES.length-1);});
  return Math.round((s/t)*100);
}
function esc(str){return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function h(tag,attrs,children){
  var a="";
  for(var k in attrs){if(attrs[k]!==null&&attrs[k]!==undefined&&attrs[k]!==false)a+=" "+k+'="'+esc(attrs[k])+'"';}
  if(children===undefined)return "<"+tag+a+"/>";
  return "<"+tag+a+">"+children+"</"+tag+">";
}

// ── TAB NAVIGATION ────────────────────────────────────
function setTab(tab){
  state.tab=tab; state.expanded=null; state.editing=null; state.adding=false;
  document.querySelectorAll(".nav-btn").forEach(function(b){b.classList.remove("active");});
  document.querySelectorAll(".nav-btn").forEach(function(b){if(b.textContent.toLowerCase().includes(tab==="auftraege"?"auftr":tab==="ofen"?"ofen":"kurs"))b.classList.add("active");});
  render();
}

// ── SETTINGS UI ───────────────────────────────────────
function openSettings(){
  document.getElementById("settings-overlay").classList.remove("hidden");
  document.getElementById("sett-trock").value = state.settings.trocknungDays;
  document.getElementById("sett-schueh").value = state.settings.ovenCapSchueh;
  document.getElementById("sett-schueh-val").textContent = state.settings.ovenCapSchueh+" Einh.";
  document.getElementById("sett-glasur").value = state.settings.ovenCapGlasur;
  document.getElementById("sett-glasur-val").textContent = state.settings.ovenCapGlasur+" Einh.";
  var sizeHtml="";
  Object.keys(SIZES).forEach(function(k){sizeHtml+='<div class="flex gap8" style="align-items:center;padding:6px 10px;background:#F7F4F4;border-radius:5px;margin-bottom:4px;border:1px solid #DDD9D5"><span style="font-weight:700;min-width:24px">'+k+'</span><span style="color:#6B6260;font-size:12px">'+SIZES[k]+' Einheiten</span></div>';});
  document.getElementById("size-table").innerHTML=sizeHtml;
}
function closeSettings(){document.getElementById("settings-overlay").classList.add("hidden");}
function saveSettings(){
  state.settings.trocknungDays = parseInt(document.getElementById("sett-trock").value)||10;
  state.settings.ovenCapSchueh = parseFloat(document.getElementById("sett-schueh").value)||14;
  state.settings.ovenCapGlasur = parseFloat(document.getElementById("sett-glasur").value)||10;
  persist(Object.assign({},state.settings,{_type:"settings"}), state.settingsDbId).then(function(id){if(!state.settingsDbId)state.settingsDbId=id;});
  closeSettings();
  render();
}

// ── RENDER ENGINE ─────────────────────────────────────
function render(){
  // Update header stats
  var done=state.orders.filter(function(o){return orderProgress(o)===100;}).length;
  var el=document.getElementById("stat-offen");if(el)el.textContent=state.orders.length-done;
  el=document.getElementById("stat-fertig");if(el)el.textContent=done;
  el=document.getElementById("stat-kurse");if(el)el.textContent=state.kurse.filter(function(k){return(k.datum||"9999")>=today||(k.datum2||"9999")>=today;}).length;

  var html="";
  if(state.syncStatus==="loading"){html='<div style="text-align:center;padding:48px;color:#8A8480">Daten werden geladen…</div>';}
  else if(state.syncStatus==="error"){html='<div style="margin:24px;background:#F5EAE8;border:1px solid #9B4030;border-radius:8px;padding:20px"><p style="font-weight:600;color:#9B4030;margin-bottom:6px">Verbindungsfehler</p><p style="font-size:13px;color:#6B6260;margin-bottom:12px">'+(state.loadError||"Supabase nicht erreichbar")+'</p><button class="btn-primary" onclick="load()">Nochmal versuchen</button></div>';}
  else if(state.tab==="auftraege"){html=renderAuftraege();}
  else if(state.tab==="ofen"){html=renderOfen();}
  else if(state.tab==="kurse"){html=renderKurse();}
  document.getElementById("main-content").innerHTML=html;
  attachEvents();
}

// ── AUFTRÄGE ──────────────────────────────────────────
function renderAuftraege(){
  var fil=state.orders.filter(function(o){
    if(state.search){var q=state.search.toLowerCase();if(!o.kunde.toLowerCase().includes(q)&&!(o.products||[]).some(function(p){return p.name.toLowerCase().includes(q);}))return false;}
    if(state.filterStage!=="alle"&&!(o.products||[]).some(function(p){return p.stage===state.filterStage&&!p.done;}))return false;
    return true;
  }).sort(function(a,b){
    if(state.sort==="delivery")return(a.delivery||"9999").localeCompare(b.delivery||"9999");
    if(state.sort==="priority"){var r={hoch:0,mittel:1,niedrig:2};return r[a.priority]-r[b.priority];}
    return a.kunde.localeCompare(b.kunde);
  });

  function stCnt(id){return state.orders.reduce(function(s,o){return s+(o.products||[]).filter(function(p){return p.stage===id&&!p.done;}).length;},0);}

  var allCnt=state.orders.reduce(function(s,o){return s+(o.products||[]).filter(function(p){return !p.done;}).length;},0);
  var tabs='<div id="stage-tabs"><button class="stage-tab'+(state.filterStage==="alle"?" active":"")+'" onclick="setFilter(\'alle\')">Alle <span style="background:'+(state.filterStage==="alle"?"#2E2621":"#DDD9D5")+';color:'+(state.filterStage==="alle"?"#F7F4F4":"#8A8480")+';border-radius:10px;padding:1px 6px;font-size:9px">'+allCnt+'</span></button>';
  STAGES.forEach(function(s){var c=stCnt(s.id);tabs+='<button class="stage-tab'+(state.filterStage===s.id?" active":"")+'" onclick="setFilter(\''+s.id+'\')">'+esc(s.label)+(c>0?' <span style="background:'+(state.filterStage===s.id?"#2E2621":"#DDD9D5")+';color:'+(state.filterStage===s.id?"#F7F4F4":"#8A8480")+';border-radius:10px;padding:1px 6px;font-size:9px">'+c+'</span>':'')+' </button>';});
  tabs+='</div>';

  var controls='<div class="stats-bar"><input class="inp" style="width:200px" placeholder="Suche…" value="'+esc(state.search)+'" oninput="state.search=this.value;render()"><select class="inp" style="width:auto" onchange="state.sort=this.value;render()"><option value="delivery"'+(state.sort==="delivery"?" selected":"")+'>Liefertermin</option><option value="priority"'+(state.sort==="priority"?" selected":"")+'>Priorität</option><option value="kunde"'+(state.sort==="kunde"?" selected":"")+'>Kunde</option></select><div class="sep"></div><button class="btn-primary" onclick="startAdd()">+ Neuer Auftrag</button></div>';

  var cards="";
  if(state.adding){cards+=renderOrderForm(null);}
  if(fil.length===0&&!state.adding){cards+='<div style="text-align:center;padding:48px;color:#8A8480">Keine Aufträge.</div>';}
  fil.forEach(function(o){
    if(state.editing===o.id){cards+=renderOrderForm(o);return;}
    cards+=renderOrderCard(o);
  });

  return controls+tabs+'<div id="content">'+cards+'</div>';
}

function renderOrderCard(o){
  var pct=orderProgress(o);
  var over=o.delivery&&o.delivery<today&&pct<100;
  var borderCol=pct===100?"#4A7C5E":over?"#9B4030":"#2E2621";
  var prodSum=(o.products||[]).map(function(p){return p.qty+"× "+p.name+(p.glasur?" ("+p.glasur+")":"");}).join(" · ");
  var prioBg={hoch:"#F5EAE8",mittel:"#F5F0E8",niedrig:"#EBF0EB"}[o.priority]||"#F5F0E8";
  var prioCol={hoch:"#9B4030",mittel:"#7A5C3A",niedrig:"#4A7C5E"}[o.priority]||"#7A5C3A";
  var prioLabel=o.priority?(o.priority.charAt(0).toUpperCase()+o.priority.slice(1)):"—";
  var pbarCol=pct===100?"#4A7C5E":pct>65?"#3A5C7A":"#2E2621";

  var html='<div class="card" style="border-left:3px solid '+borderCol+'">';
  html+='<div class="card-header">';
  html+='<div style="flex:2 1 140px"><span style="font-size:15px;font-weight:600">'+esc(o.kunde||"—")+'</span>'+(o.kundenWunsch?'<span style="margin-left:8px;font-size:10px;color:#8A8480;font-style:italic" title="'+esc(o.kundenWunsch)+'">✦ Sonderwunsch</span>':'')+' </div>';
  html+='<div style="flex:3 1 180px;font-size:12px;color:#8A8480">'+esc(prodSum)+'</div>';
  html+='<span class="badge" style="background:'+prioBg+';color:'+prioCol+'">'+prioLabel+'</span>';
  html+='<span style="font-size:12px;color:'+(over?"#9B4030":"#8A8480")+';white-space:nowrap">'+(over?"⚠ ":"")+'📅 '+esc(o.delivery||"—")+'</span>';
  html+='<div style="display:inline-flex;align-items:center;gap:6px;flex-shrink:0"><div class="pbar-wrap"><div class="pbar-fill" style="width:'+pct+'%;background:'+pbarCol+'"></div></div><span style="font-size:11px;font-weight:600;color:'+pbarCol+'">'+pct+'%</span></div>';
  html+='<div style="display:flex;gap:5px;margin-left:auto;flex-shrink:0">';
  html+='<button class="btn" onclick="startEdit(\''+o.id+'\')">✎</button>';
  html+='<button class="btn" onclick="toggleExpand(\''+o.id+'\')">'+(state.expanded===o.id?"▲":"▼")+'</button>';
  html+='<button class="btn btn-danger" onclick="doDelOrder(\''+o.id+'\')">✕</button>';
  html+='</div></div>';
  html+='<div style="height:2px;background:#F7F4F4"><div style="height:2px;width:'+pct+'%;background:'+pbarCol+';transition:width .4s"></div></div>';

  if(state.expanded===o.id){
    html+='<div class="expanded">';
    if(o.delivery){
      var dl=calcDL(o.delivery);
      var st2=STAGES.map(function(s){return s.id==="trocknung"?Object.assign({},s,{days:state.settings.trocknungDays}):s;});
      html+='<div class="timeline"><div class="lbl">Rückwärtsplanung — Liefertermin '+esc(o.delivery)+'</div><div class="tl-cells">';
      st2.forEach(function(s){var d=dl[s.id],past=d<today;html+='<div class="tl-cell"><div style="font-size:9px;color:#8A8480;text-transform:uppercase;margin-bottom:3px">'+s.short+(s.id==="trocknung"?'<br><span style="color:#C4BEBA">'+state.settings.trocknungDays+'d</span>':'')+' </div><span class="tl-date" style="color:'+(past?"#9B4030":"#2E2621")+';background:'+(s.id==="trocknung"?"#F5EEE0":"#fff")+';border-color:'+(s.id==="trocknung"?"#C4BEBA":"#DDD9D5")+'">'+d+'</span></div>';});
      html+='<div class="tl-cell"><div style="font-size:9px;color:#8A8480;text-transform:uppercase;margin-bottom:3px">Lieferung</div><span class="tl-date" style="font-weight:700;background:#EAE3DC;border-color:#C4BEBA">'+esc(o.delivery)+'</span></div>';
      html+='</div></div>';
    }
    if(o.kundenWunsch){html+='<div style="margin-top:12px;background:#F5EEE0;border:1px solid #DDD9D5;border-left:3px solid #C4BEBA;border-radius:6px;padding:8px 12px"><div class="lbl" style="margin-bottom:3px">Kundenwunsch</div><p style="font-size:13px;color:#6B6260;line-height:1.6">'+esc(o.kundenWunsch)+'</p></div>';}
    var totalPcs=(o.products||[]).reduce(function(s,p){return s+p.qty;},0);
    var donePcs=(o.products||[]).filter(function(p){return p.done;}).length;
    html+='<div class="lbl" style="margin-top:14px;margin-bottom:8px">Produkte — '+totalPcs+' Stk. · '+donePcs+'/'+(o.products||[]).length+' abgeschlossen</div>';
    (o.products||[]).forEach(function(p){html+=renderProdRow(o.id,p);});
    html+='</div>';
  }
  html+='</div>';
  return html;
}

function renderProdRow(oid, p){
  var idx=sidx(p.stage);
  var szKey=(p.groesse||"M").toUpperCase();
  var units=ovenUnits(p);
  var splitKey=oid+"_"+p.id;
  var isSplitting=state.splitting===splitKey;
  var html='<div style="background:'+(p.done?"#F7F4F4":"#fff")+';border:1px solid #DDD9D5;border-radius:6px;padding:9px 11px;margin-bottom:5px;opacity:'+(p.done?0.6:1)+'">';
  html+='<div class="flex gap8" style="align-items:center;flex-wrap:wrap">';
  html+='<button style="width:18px;height:18px;border-radius:3px;border:1.5px solid '+(p.done?"#4A7C5E":"#C4BEBA")+';background:'+(p.done?"#4A7C5E":"none")+';flex-shrink:0;padding:0;display:flex;align-items:center;justify-content:center" onclick="doDoneProd(\''+oid+'\',\''+p.id+'\')">'+(p.done?'<span style="color:#fff;font-size:10px">✓</span>':'')+' </button>';
  html+='<div style="flex:2 1 110px"><span style="font-size:13px;font-weight:600;text-decoration:'+(p.done?"line-through":"none")+'">'+esc(p.name||"—")+'</span><span style="font-size:12px;color:#8A8480;margin-left:6px">×'+p.qty+'</span>'+(p.glasur?'<span style="font-size:11px;color:#8A8480"> · '+esc(p.glasur)+'</span>':'')+(p.stage==="glasurbrand"&&p.glasurTemp?'<span class="badge" style="margin-left:6px;font-size:9px;background:'+(p.glasurTemp==="1100"?"#F5EAE8":"#EAE8F5")+';color:'+(p.glasurTemp==="1100"?"#9B4030":"#3A5C7A")+'">'+p.glasurTemp+'°</span>':'')+' </div>';
  if(SIZES[szKey])html+='<span class="badge" style="background:#F7F4F4;color:#6B6260;border-color:#DDD9D5;font-weight:600">'+szKey+' · '+units+' Einh.</span>';
  if(!p.done){
    html+='<div style="display:flex;align-items:center;gap:2px;flex:3 1 260px;overflow-x:auto">';
    STAGES.forEach(function(s,i){var done2=i<idx,act=i===idx;html+='<button onclick="doMoveProd(\''+oid+'\',\''+p.id+'\',\''+s.id+'\')" style="padding:3px 6px;border-radius:4px;font-size:9px;font-weight:'+(act?700:400)+';white-space:nowrap;background:'+(act?"#2E2621":done2?"#DDD9D5":"#F7F4F4")+';color:'+(act?"#F7F4F4":done2?"#6B6260":"#8A8480")+';border:1px solid '+(act?"#2E2621":"#DDD9D5")+'">'+s.short+(done2?" ✓":"")+' </button>'+(i<STAGES.length-1?'<div style="width:5px;height:1px;background:'+(done2?"#C4BEBA":"#DDD9D5")+';flex-shrink:0"></div>':'');});
    html+='</div>';
    html+='<div style="display:flex;gap:4px;margin-left:auto;flex-shrink:0">';
    html+='<button class="btn" '+(idx===0?"disabled":"")+' onclick="doMoveProd(\''+oid+'\',\''+p.id+'\',\''+(STAGES[idx-1]?STAGES[idx-1].id:"")+'\')">◂</button>';
    // Next button: if qty > 1, show split option; else move all
    if(idx < STAGES.length-1){
      if(p.qty > 1){
        html+='<button class="btn" onclick="startSplit(\''+oid+'\',\''+p.id+'\')" style="color:#2E2621;font-weight:600" title="Teilweise weiterschieben">▸</button>';
      } else {
        html+='<button class="btn" onclick="doMoveProd(\''+oid+'\',\''+p.id+'\',\''+(STAGES[idx+1]?STAGES[idx+1].id:"")+'\')">▸</button>';
      }
    } else {
      html+='<button class="btn" disabled>▸</button>';
    }
    html+='</div>';
  }
  html+='</div>';
  if(p.note)html+='<p style="font-size:11px;color:#8A8480;font-style:italic;margin-top:5px;padding-left:26px">↳ '+esc(p.note)+'</p>';

  // Split UI
  if(isSplitting && !p.done && idx < STAGES.length-1){
    var nextStage=STAGES[idx+1];
    html+='<div style="margin-top:8px;padding:10px 12px;background:#F7F4F4;border-radius:6px;border:1px solid #DDD9D5">';
    html+='<div style="font-size:11px;color:#6B6260;margin-bottom:8px">Wie viele von <strong>'+p.qty+'×</strong> weiter zu <strong>'+nextStage.label+'</strong>?</div>';
    html+='<div class="flex gap8" style="align-items:center">';
    html+='<input type="number" id="split-qty-'+p.id+'" min="1" max="'+(p.qty-1)+'" value="1" class="inp-inline" style="width:70px;text-align:center;font-size:16px;font-weight:300">';
    html+='<span style="font-size:12px;color:#8A8480">von '+p.qty+' Stk.</span>';
    html+='<button class="btn-primary" style="font-size:11px;padding:6px 14px" onclick="doPartialMove(\''+oid+'\',\''+p.id+'\',\''+nextStage.id+'\')">Weiterschieben</button>';
    html+='<button class="btn-sec" style="font-size:11px;padding:6px 10px" onclick="cancelSplit()">Abbrechen</button>';
    html+='</div></div>';
  }

  html+='</div>';
  return html;
}

// ── ORDER FORM ────────────────────────────────────────

  var stageOpts=STAGES.map(function(s){return '<option value="'+s.id+'">'+s.label+'</option>';}).join("");

  var prods=o.products.map(function(p,i){

      +'<select class="inp-inline" onchange="updateFormProd(\''+o.id+'\',\''+p.id+'\',\'glasurTemp\',this.value)"><option value="1100"'+(p.glasurTemp==="1100"?" selected":"")+'>1100°</option><option value="1240"'+(p.glasurTemp!=="1100"?" selected":"")+'>1240°</option></select>'
      +'<select class="inp-inline" onchange="updateFormProd(\''+o.id+'\',\''+p.id+'\',\'groesse\',this.value)">'+Object.keys(SIZES).map(function(k){return '<option value="'+k+'"'+(p.groesse===k?" selected":"")+'>'+k+' – '+SIZES[k]+'</option>';}).join("")+'</select>'

      +'<input class="inp-inline" style="flex:2 1 110px" placeholder="Notiz" value="'+esc(p.note)+'" onchange="updateFormProd(\''+o.id+'\',\''+p.id+'\',\'note\',this.value)">'
      +'<button style="background:none;border:none;color:#9B4030;font-size:14px;cursor:pointer" onclick="removeFormProd(\''+o.id+'\',\''+p.id+'\')">✕</button>'
      +'</div>';
  }).join("");

  return '<div class="form-box" id="'+pid+'">'
    +'<div class="lbl" style="margin-bottom:16px;font-size:12px">'+(isNew?"Neuer Auftrag":"Auftrag bearbeiten")+'</div>'

    +'<input class="inp" type="date" style="flex:1 1 140px" value="'+esc(o.delivery||"")+'" onchange="formField(\''+o.id+'\',\'delivery\',this.value)">'

    +'<option value="mittel"'+(o.priority==="mittel"?" selected":"")+'>Priorität: Mittel</option>'
    +'<option value="niedrig"'+(o.priority==="niedrig"?" selected":"")+'>Priorität: Niedrig</option>'
    +'</select></div>'
    +'<textarea class="inp" rows="2" style="width:100%;resize:vertical;line-height:1.6;margin-bottom:14px" placeholder="Kundenwünsche…" onchange="formField(\''+o.id+'\',\'kundenWunsch\',this.value)">'+esc(o.kundenWunsch||"")+'</textarea>'
    +'<div class="lbl" style="margin-bottom:10px">Produkte</div>'
    +'<div id="prods-'+o.id+'">'+prods+'</div>'
    +'<button class="btn-dashed mt8" onclick="addFormProd(\''+o.id+'\')">+ Produkt hinzufügen</button>'
    +'<div class="flex gap8 mt12">'

    +'</div></div>';
}

// form state
var formData={};
function startAdd(){state.adding=true;state.editing=null;state.expanded=null;formData={};render();}
function startEdit(id){state.editing=id;state.adding=false;state.expanded=id;formData={};render();}
function cancelForm(){state.adding=false;state.editing=null;formData={};render();}
function formField(oid,k,v){if(!formData[oid])formData[oid]={};formData[oid][k]=v;}
function updateFormProd(oid,pid,k,v){if(!formData[oid])formData[oid]={};if(!formData[oid].prods)formData[oid].prods={};if(!formData[oid].prods[pid])formData[oid].prods[pid]={};formData[oid].prods[pid][k]=v;}
function removeFormProd(oid,pid){
  var o=state.adding?{id:oid,products:[]}:state.orders.find(function(x){return x.id===oid;})||{id:oid,products:[]};
  var merged=mergeForm(o);
  merged.products=merged.products.filter(function(p){return p.id!==pid;});
  if(state.adding){
    var tmp={id:oid,kunde:merged.kunde||"",delivery:merged.delivery||"",priority:merged.priority||"mittel",kundenWunsch:merged.kundenWunsch||"",products:merged.products};
    formData[oid]={_tmp:tmp};
  } else {
    formData[oid]={_tmp:merged};
  }
  render();
}
function addFormProd(oid){
  var o=state.adding?{id:oid,products:[]}:state.orders.find(function(x){return x.id===oid;})||{id:oid,products:[]};
  var merged=mergeForm(o);
  merged.products.push({id:uid(),name:"",qty:1,glasur:"",glasurTemp:"1240",groesse:"M",stage:"produktion",note:"",done:false});
  formData[oid]={_tmp:merged};
  render();
}
function mergeForm(o){
  var fd=formData[o.id]||{};
  if(fd._tmp)return JSON.parse(JSON.stringify(fd._tmp));
  var prods=(o.products||[]).map(function(p){var fp=(fd.prods||{})[p.id]||{};return Object.assign({},p,fp);});
  return Object.assign({},o,{kunde:fd.kunde!==undefined?fd.kunde:o.kunde,delivery:fd.delivery!==undefined?fd.delivery:o.delivery,priority:fd.priority!==undefined?fd.priority:o.priority,kundenWunsch:fd.kundenWunsch!==undefined?fd.kundenWunsch:o.kundenWunsch,products:prods});
}
function saveForm(oid,isNew){
  var o=isNew?{id:oid,products:[]}:state.orders.find(function(x){return x.id===oid;});
  var merged=mergeForm(o);
  if(!merged.kunde){alert("Bitte Kunde eingeben.");return;}
  if(isNew){
    state.orders.push(merged);
    state.adding=false;
    persist(Object.assign({},merged,{_type:"order"}),null).then(function(id){merged._dbId=id;});
  } else {
    state.orders=state.orders.map(function(x){return x.id===oid?merged:x;});
    state.editing=null;
    persist(Object.assign({},merged,{_type:"order"}),merged._dbId);
  }
  formData={};
  render();
}

// ── ORDER ACTIONS ─────────────────────────────────────
function toggleExpand(id){state.expanded=state.expanded===id?null:id;state.splitting=null;render();}
function doDelOrder(id){var o=state.orders.find(function(x){return x.id===id;});state.orders=state.orders.filter(function(x){return x.id!==id;});if(o&&o._dbId)delRow(o._dbId).catch(function(){});render();}
function doMoveProd(oid,pid,stage){if(!stage)return;state.splitting=null;state.orders=state.orders.map(function(o){if(o.id!==oid)return o;return Object.assign({},o,{products:(o.products||[]).map(function(p){return p.id===pid?Object.assign({},p,{stage:stage,done:false}):p;})});});var upd=state.orders.find(function(x){return x.id===oid;});persist(Object.assign({},upd,{_type:"order"}),upd._dbId);render();}
function doDoneProd(oid,pid){state.splitting=null;state.orders=state.orders.map(function(o){if(o.id!==oid)return o;return Object.assign({},o,{products:(o.products||[]).map(function(p){return p.id===pid?Object.assign({},p,{done:!p.done}):p;})});});var upd=state.orders.find(function(x){return x.id===oid;});persist(Object.assign({},upd,{_type:"order"}),upd._dbId);render();}
function setFilter(s){state.filterStage=s;render();}
function startSplit(oid,pid){state.splitting=oid+"_"+pid;render();}
function cancelSplit(){state.splitting=null;render();}
function doPartialMove(oid,pid,toStage){
  var el=document.getElementById("split-qty-"+pid);
  var moveQty=Math.max(1,parseInt(el?el.value:1)||1);
  state.orders=state.orders.map(function(o){
    if(o.id!==oid)return o;
    var newProds=[];
    (o.products||[]).forEach(function(p){
      if(p.id!==pid){newProds.push(p);return;}
      if(moveQty>=p.qty){
        newProds.push(Object.assign({},p,{stage:toStage,done:false}));
      } else {
        newProds.push(Object.assign({},p,{id:uid(),qty:moveQty,stage:toStage,done:false}));
        newProds.push(Object.assign({},p,{qty:p.qty-moveQty}));
      }
    });
    return Object.assign({},o,{products:newProds});
  });
  state.splitting=null;
  var upd=state.orders.find(function(x){return x.id===oid;});
  persist(Object.assign({},upd,{_type:"order"}),upd._dbId);
  render();
}

// ── OVEN VIEW ─────────────────────────────────────────
function renderOfen(){
  var cS=state.settings.ovenCapSchueh, cG=state.settings.ovenCapGlasur;
  var all=[];
  state.orders.forEach(function(o){(o.products||[]).forEach(function(p){var st=STAGES.find(function(s){return s.id===p.stage;});if(!p.done&&st&&st.oven)all.push(Object.assign({},p,{kunde:o.kunde,delivery:o.delivery,units:ovenUnits(p)}));});});
  all.sort(function(a,b){return(a.delivery||"9999").localeCompare(b.delivery||"9999");});
  var sch=all.filter(function(p){return p.stage==="schuehbrand";});
  var g1=all.filter(function(p){return p.stage==="glasurbrand"&&(p.glasurTemp||"1240")==="1100";});
  var g2=all.filter(function(p){return p.stage==="glasurbrand"&&(p.glasurTemp||"1240")==="1240";});

  function makeBatches(items,cap){var b=[],cur=[],used=0;items.forEach(function(p){if(used+p.units>cap&&cur.length){b.push({items:cur,used:used});cur=[];used=0;}cur.push(p);used+=p.units;});if(cur.length)b.push({items:cur,used:used});return b;}
  function renderCol(items,title,sub,col,cap){
    var bs=makeBatches(items,cap);
    var html='<div class="oven-col"><div class="lbl" style="color:'+col+';margin-bottom:4px">'+title+'</div><div style="font-size:11px;color:#8A8480;margin-bottom:14px">'+sub+' · '+cap+' Einheiten</div>';
    if(bs.length===0)html+='<div style="background:#fff;border:1px solid #DDD9D5;border-radius:8px;padding:18px;text-align:center;color:#8A8480;font-style:italic;font-size:13px">Keine Aufträge</div>';
    bs.forEach(function(b,i){
      var pct=Math.min(100,(b.used/cap)*100),full=b.used>=cap*0.95,soon=b.items.map(function(p){return p.delivery;}).sort()[0];
      html+='<div class="batch-card" style="border-left-color:'+col+'">';
      html+='<div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:8px"><span class="lbl" style="color:'+col+'">BRAND #'+(i+1)+'</span><span style="font-weight:600;font-size:13px;color:'+(full?col:"#6B6260")+'">'+b.used.toFixed(1)+' / '+cap+' Einh.</span></div>';
      html+='<div class="seg-bar">';
      b.items.forEach(function(p,j){html+='<div style="height:100%;width:'+(p.units/cap*100)+'%;background:'+COLS[j%COLS.length]+';border-radius:2px;flex-shrink:0"></div>';});
      html+='</div>';
      html+='<p style="font-size:11px;color:#8A8480;margin-bottom:8px">Frühester Termin: <strong style="color:#2E2621">'+esc(soon)+'</strong></p>';
      b.items.forEach(function(p,j){var sk=(p.groesse||"M").toUpperCase();var tu=(p.qty*(SIZES[sk]||1.5));html+='<div class="flex gap8" style="align-items:center;padding:4px 0;border-top:1px solid #F7F4F4;font-size:12px"><div style="width:8px;height:8px;border-radius:2px;background:'+COLS[j%COLS.length]+';flex-shrink:0"></div><span style="flex:1;color:#6B6260">'+esc(p.kunde)+' – '+esc(p.name)+'</span><span class="badge" style="background:#F7F4F4;border-color:#DDD9D5;color:#8A8480">'+sk+'</span><span style="color:#8A8480;min-width:65px;text-align:right">'+p.qty+'× · '+tu.toFixed(1)+' Einh.</span></div>';});
      if(!full)html+='<div class="flex gap8 mt8" style="align-items:center;padding:5px 8px;background:#F7F4F4;border-radius:4px"><div style="flex:1;height:3px;background:#DDD9D5;border-radius:2px"><div style="height:3px;width:'+pct+'%;background:'+col+';border-radius:2px"></div></div><span style="font-size:11px;color:#8A8480;white-space:nowrap">'+((cap-b.used).toFixed(1))+' frei</span></div>';
      html+='</div>';
    });
    html+='</div>';
    return html;
  }

  var legend=Object.keys(SIZES).map(function(k){return '<div class="flex gap8" style="align-items:center;padding:3px 10px;background:#fff;border:1px solid #DDD9D5;border-radius:20px;font-size:11px"><span style="font-weight:700">'+k+'</span><span style="color:#8A8480">'+SIZES[k]+' Einh.</span></div>';}).join("");
  return '<div style="padding:28px"><div class="lbl" style="font-size:12px;letter-spacing:2px;margin-bottom:10px">Ofenplanung</div><div class="flex gap8" style="flex-wrap:wrap;margin-bottom:22px">'+legend+'</div><div class="flex gap8" style="flex-wrap:wrap;align-items:flex-start">'+renderCol(sch,"SCHRÜHBRAND — OFEN A","Stapelbar","#7A5C3A",cS)+renderCol(g1,"GLASURBRAND 1100° — OFEN B","Kein Stapeln","#6B3A7A",cG)+renderCol(g2,"GLASURBRAND 1240° — OFEN C","Kein Stapeln","#3A5C7A",cG)+'</div></div>';
}

// ── KURS VIEW ─────────────────────────────────────────
var kursNurKommend=true;

function renderKurse(){
  var kom=state.kurse.filter(function(k){return(k.datum||"9999")>=today||(k.datum2||"9999")>=today;});
  var bel=kom.reduce(function(s,k){return s+(k.teilnehmende||[]).length;},0);
  var mxT=kom.reduce(function(s,k){return s+(k.maxPlaetze||8);},0);
  var bezT=kom.reduce(function(s,k){return s+(k.teilnehmende||[]).filter(function(t){return t.bezahlt;}).length;},0);

  var fil=state.kurse.filter(function(k){return !kursNurKommend||((k.datum||"9999")>=today||(k.datum2||"9999")>=today);}).sort(function(a,b){return(a.datum||"9999").localeCompare(b.datum||"9999");});

  var stats='<div class="stats-bar">'
    +['<div class="stat"><div class="stat-val">'+kom.length+'</div><div class="stat-lbl">Kurse</div></div>','<div class="stat"><div class="stat-val" style="color:#7A5C3A">'+bel+'/'+mxT+'</div><div class="stat-lbl">Belegt</div></div>','<div class="stat"><div class="stat-val" style="color:#4A7C5E">'+bezT+'</div><div class="stat-lbl">Bezahlt</div></div>','<div class="stat"><div class="stat-val" style="color:'+(bel-bezT>0?"#9B4030":"#8A8480")+'">'+( bel-bezT)+'</div><div class="stat-lbl">Ausstehend</div></div>'].join("")
    +'<div class="sep"></div>'
    +'<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#8A8480;cursor:pointer"><input type="checkbox"'+(kursNurKommend?" checked":"")+' onchange="kursNurKommend=this.checked;render()"> Nur kommende</label>'
    +'<button class="btn-primary" onclick="doAddKurs()">+ Neuer Kurs</button>'
    +'</div>';

  var cards=fil.map(function(k){return renderKursCard(k);}).join("");
  if(fil.length===0)cards='<div style="text-align:center;padding:48px;color:#8A8480">Keine Kurse vorhanden.</div>';
  return stats+'<div id="content">'+cards+'</div>';
}

function renderKursCard(k){

  var pct=Math.min(100,Math.round((n/max)*100));
  var bez=(k.teilnehmende||[]).filter(function(t){return t.bezahlt;}).length;
  var voll=n>=max;
  var barCol=pct>=100?"#9B4030":pct>=75?"#7A5C3A":"#4A7C5E";
  var isOpen=state.expanded===k.id;

  var html='<div class="kurs-card"><div class="kurs-header">';

  html+='<div style="display:flex;align-items:center;gap:4px"><span style="font-size:9px;color:#C4BEBA;width:14px;text-align:right">2</span><input class="inp-inline" type="date" value="'+esc(k.datum2||"")+'" onchange="doUpdKurs(\''+k.id+'\',\'datum2\',this.value)" title="Datum 2 (optional)" style="opacity:'+(k.datum2?1:0.45)+'" onfocus="this.style.opacity=1" onblur="this.style.opacity=this.value?1:0.45"><input class="inp-inline" style="width:100px;opacity:'+(k.uhrzeit2?1:0.45)+'" placeholder="Uhrzeit" value="'+esc(k.uhrzeit2||"")+'" onchange="doUpdKurs(\''+k.id+'\',\'uhrzeit2\',this.value)" title="Uhrzeit Datum 2" onfocus="this.style.opacity=1" onblur="this.style.opacity=this.value?1:0.45"></div>';
  html+='</div>';
  html+='<div style="flex:1 1 150px">';
  html+='<div class="flex" style="justify-content:space-between;align-items:center;margin-bottom:4px"><div class="flex gap8" style="align-items:center;font-size:11px;color:#8A8480"><span>'+n+' /</span><input class="inp-inline" type="number" style="width:44px;padding:2px 4px;font-size:11px;text-align:center" value="'+max+'" min="1" max="30" onchange="doUpdKurs(\''+k.id+'\',\'maxPlaetze\',parseInt(this.value)||8)"><span>Plätze</span></div>'+(voll?'<span style="font-size:10px;color:#9B4030;font-weight:600">ausgebucht</span>':'')+' </div>';
  html+='<div style="height:5px;background:#DDD9D5;border-radius:3px;overflow:hidden"><div style="height:5px;width:'+pct+'%;background:'+barCol+';border-radius:3px;transition:width .3s"></div></div>';
  html+='</div>';
  html+='<span class="badge" style="background:#F7F4F4;color:#8A8480;border-color:#DDD9D5;flex-shrink:0">'+bez+'/'+n+' bezahlt</span>';
  html+='<div style="display:flex;gap:5px;margin-left:auto;flex-shrink:0"><button class="btn" onclick="toggleExpand(\''+k.id+'\')">'+(isOpen?"▲":"▼")+'</button><button class="btn btn-danger" onclick="doDelKurs(\''+k.id+'\')">✕</button></div>';
  html+='</div>';

  if(isOpen){
    html+='<div class="kurs-expanded">';

      html+='<button style="background:none;border:none;color:#9B4030;font-size:14px;cursor:pointer;flex-shrink:0" onclick="doDelTN(\''+k.id+'\','+i+')">✕</button>';
      html+='</div>';
    });
    html+='</div>';
  }
  html+='</div>';
  return html;
}

function doAddKurs(){var neu={id:uid(),_type:"kurs",titel:"",datum:"",datum2:"",uhrzeit:"",uhrzeit2:"",maxPlaetze:8,teilnehmende:[]};state.kurse.push(neu);persist(Object.assign({},neu),null).then(function(id){neu._dbId=id;});state.expanded=neu.id;render();}
function doUpdKurs(id,k,v){var kurs=state.kurse.find(function(x){return x.id===id;});if(!kurs)return;kurs[k]=v;persist(Object.assign({},kurs,{_type:"kurs"}),kurs._dbId);}
function doDelKurs(id){var kurs=state.kurse.find(function(x){return x.id===id;});state.kurse=state.kurse.filter(function(x){return x.id!==id;});if(kurs&&kurs._dbId)delRow(kurs._dbId).catch(function(){});render();}
function doDelOrder(id){var o=state.orders.find(function(x){return x.id===id;});state.orders=state.orders.filter(function(x){return x.id!==id;});if(o&&o._dbId)delRow(o._dbId).catch(function(){});render();}function doAddTN(kid){var kurs=state.kurse.find(function(x){return x.id===kid;});if(!kurs)return;kurs.teilnehmende=kurs.teilnehmende||[];kurs.teilnehmende.push({id:uid(),name:"",email:"",tel:"",notiz:"",bezahlt:false});render();}
function doUpdTN(kid,i,k,v){var kurs=state.kurse.find(function(x){return x.id===kid;});if(!kurs||!kurs.teilnehmende[i])return;kurs.teilnehmende[i][k]=v;persist(Object.assign({},kurs,{_type:"kurs"}),kurs._dbId);}
function doToggleTNBez(kid,i){var kurs=state.kurse.find(function(x){return x.id===kid;});if(!kurs||!kurs.teilnehmende[i])return;kurs.teilnehmende[i].bezahlt=!kurs.teilnehmende[i].bezahlt;persist(Object.assign({},kurs,{_type:"kurs"}),kurs._dbId);render();}
function doDelTN(kid,i){var kurs=state.kurse.find(function(x){return x.id===kid;});if(!kurs)return;kurs.teilnehmende.splice(i,1);persist(Object.assign({},kurs,{_type:"kurs"}),kurs._dbId);render();}

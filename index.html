<body>
<div id="root"></div>
<script type="text/javascript">
const {useState,useEffect} = React;

// ── SUPABASE ──────────────────────────────────────────
const SB = "https://yngvgsakkceetsrpkwcc.supabase.co";
const KEY = "sb_publishable_bOPM5VwkMQ3P0GhSjLoBnQ_-XZVPcYq";

async function api(path, opts={}) {
  const h = {"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Prefer":opts.prefer||"",...(opts.headers||{})};
  const r = await fetch(SB+path,{...opts,headers:h});
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function loadAll() {
  const rows = await api("/rest/v1/orders?select=*&order=updated_at.asc");
  const settings = rows.find(r=>r.data&&r.data._type==="settings");
  const orders   = rows.filter(r=>r.data&&r.data._type==="order").map(r=>({...r.data,_dbId:r.id}));
  const kurse    = rows.filter(r=>r.data&&r.data._type==="kurs").map(r=>({...r.data,_dbId:r.id}));
  return {orders, kurse, settings:settings?settings.data:null, settingsDbId:settings?settings.id:null};
}
async function saveRow(data, dbId) {
  if (dbId) {
    await api("/rest/v1/orders?id=eq."+dbId, {method:"PATCH",prefer:"return=minimal",body:JSON.stringify({data,updated_at:new Date().toISOString()})});
    return dbId;
  }
  const r = await api("/rest/v1/orders", {method:"POST",prefer:"return=representation",body:JSON.stringify({data,updated_at:new Date().toISOString()})});
  return r[0].id;
}
async function delRow(dbId) {
  await api("/rest/v1/orders?id=eq."+dbId, {method:"DELETE"});
}

// ── CONSTANTS ─────────────────────────────────────────
const INK="#2E2621", BG="#F7F4F4", MUT="#DDD9D5", MUTDK="#C4BEBA", STN="#8A8480", MID="#6B6260", WHT="#FFFFFF", OK="#4A7C5E", WRN="#9B4030", OA="#7A5C3A", OB="#3A5C7A";
const SIZES = {XS:0.5,S:1,M:1.5,L:2,XL:3};
const STAGES = [
  {id:"produktion",label:"Produktion",short:"Prod.",days:1,oven:false},
  {id:"trocknung",label:"Trocknung",short:"Trock.",days:null,oven:false},
  {id:"schuehbrand",label:"Schrühbrand",short:"Schr.",days:2,oven:true},
  {id:"glasieren",label:"Glasieren",short:"Glas.",days:1,oven:false},
  {id:"glasurbrand",label:"Glasurbrand",short:"GlBr.",days:2,oven:true},
  {id:"konfektionierung",label:"Konfektionierung",short:"Konf.",days:1,oven:false},
];
const SIDS = STAGES.map(s=>s.id);
const DEF = {trocknungDays:10,ovenCapSchueh:14,ovenCapGlasur:10};
const today = new Date().toISOString().split("T")[0];
let uid = Date.now();

// ── HELPERS ───────────────────────────────────────────
function sidx(id){return SIDS.indexOf(id);}
function subDays(d,n){const dt=new Date(d);dt.setDate(dt.getDate()-n);return dt.toISOString().split("T")[0];}
function getStages(s){return STAGES.map(st=>st.id==="trocknung"?{...st,days:s.trocknungDays}:st);}
function calcDL(delivery,s){const st=getStages(s);const m={};let c=delivery;[...st].reverse().forEach(x=>{c=subDays(c,x.days);m[x.id]=c;});return m;}
function ovenUnits(p){return p.qty*(SIZES[(p.groesse||"M").toUpperCase()]||SIZES.M);}
function progress(order){
  const t=order.products.length;
  if(!t)return 0;
  const s=order.products.reduce((a,p)=>{if(p.done)return a+1;return a+sidx(p.stage)/(SIDS.length-1);},0);
  return Math.round((s/t)*100);
}

// ── SMALL COMPONENTS ──────────────────────────────────
function PBar({pct}){
  const col=pct===100?OK:pct>65?OB:INK;

    React.createElement("span",{style:{fontSize:11,fontWeight:600,color:col,minWidth:32}},pct+"%")
  );
}

function SyncDot({status}){
  const col={idle:OK,saving:OA,error:WRN,loading:MUTDK}[status]||MUTDK;
  const label={idle:"Gespeichert",saving:"Wird gespeichert…",error:"Fehler",loading:"Lädt…"}[status]||"";
  return React.createElement("div",{title:label,style:{display:"flex",alignItems:"center",gap:5}},
    React.createElement("div",{style:{width:8,height:8,borderRadius:"50%",background:col}}),
    status==="error"&&React.createElement("span",{style:{fontSize:11,color:WRN}},"Sync-Fehler")
  );
}

          React.createElement("span",{style:{color:STN,fontSize:13}},"Tage")
        ),
        React.createElement("p",{className:"lbl",style:{marginBottom:16}},"Ofenkapazität"),
        [{key:"ovenCapSchueh",label:"Schrühbrand",sub:"stapelbar",col:OA},{key:"ovenCapGlasur",label:"Glasurbrand",sub:"kein Stapeln",col:OB}].map(({key,label,sub,col})=>
          React.createElement("div",{key,style:{marginBottom:20}},
            React.createElement("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:6}},
              React.createElement("span",{style:{fontSize:10,letterSpacing:2,textTransform:"uppercase",color:col}},label+" · "+sub),
              React.createElement("span",{style:{fontSize:16,fontWeight:300,color:INK}},loc[key]+" Einh.")
            ),
            React.createElement("input",{type:"range",min:2,max:40,step:0.5,value:loc[key],onChange:e=>set(key,parseFloat(e.target.value)),style:{width:"100%"}})
          )
        ),
        React.createElement("p",{className:"lbl",style:{marginBottom:10,marginTop:8}},"Grössen & Einheiten"),
        Object.entries(SIZES).map(([k,v])=>
          React.createElement("div",{key:k,style:{display:"flex",gap:10,padding:"6px 10px",background:BG,borderRadius:5,marginBottom:4,border:"1px solid "+MUT}},
            React.createElement("span",{style:{fontWeight:700,color:INK,minWidth:24}},k),
            React.createElement("span",{style:{color:MID,fontSize:12}},v+" Einheiten")
          )
        )
      ),
      React.createElement("div",{style:{borderTop:"1px solid "+MUT,padding:"16px 28px",display:"flex",gap:10}},
        React.createElement("button",{className:"btn-primary",style:{flex:1},onClick:()=>{onChange(loc);onClose();}},"Speichern"),
        React.createElement("button",{className:"btn-sec",style:{flex:1},onClick:onClose},"Abbrechen")
      )
    )
  );
}

// ── DEADLINE TIMELINE ─────────────────────────────────
function Timeline({delivery,s}){
  if(!delivery)return null;
  const dates=calcDL(delivery,s);
  const stages=getStages(s);
  return React.createElement("div",{style:{background:BG,border:"1px solid "+MUT,borderRadius:8,padding:"12px 14px",marginTop:12}},
    React.createElement("p",{className:"lbl",style:{marginBottom:10}},"Rückwärtsplanung — Liefertermin "+delivery),
    React.createElement("div",{style:{display:"flex",gap:3,flexWrap:"wrap"}},
      stages.map(st=>{
        const d=dates[st.id],past=d<today;
        return React.createElement("div",{key:st.id,style:{flex:"1 1 70px",textAlign:"center"}},
          React.createElement("p",{style:{fontSize:9,color:STN,textTransform:"uppercase",marginBottom:3}},st.short,(st.id==="trocknung")&&React.createElement("span",{style:{display:"block",color:MUTDK}},s.trocknungDays+"d")),
          React.createElement("p",{style:{fontSize:11,fontWeight:600,color:past?WRN:INK,padding:"3px 2px",borderRadius:4,background:st.id==="trocknung"?"#F5EEE0":WHT,border:"1px solid "+(st.id==="trocknung"?MUTDK:MUT)}},d)
        );
      }),
      React.createElement("div",{style:{flex:"1 1 70px",textAlign:"center"}},
        React.createElement("p",{style:{fontSize:9,color:STN,textTransform:"uppercase",marginBottom:3}},"Lieferung"),
        React.createElement("p",{style:{fontSize:11,fontWeight:700,color:INK,padding:"3px 2px",borderRadius:4,background:"#EAE3DC",border:"1px solid "+MUTDK}},delivery)
      )
    )

}

// ── PRODUCT ROW ───────────────────────────────────────
function ProdRow({p,onMove,onDone}){
  const idx=sidx(p.stage);
  const units=ovenUnits(p);
  const szKey=(p.groesse||"M").toUpperCase();

    React.createElement("div",{className:"row"},
      React.createElement("button",{onClick:()=>onDone(p.id),style:{width:18,height:18,borderRadius:3,border:"1.5px solid "+(p.done?OK:MUTDK),background:p.done?OK:"none",cursor:"pointer",flexShrink:0,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}},
        p.done&&React.createElement("span",{style:{color:WHT,fontSize:10}},"✓")

      React.createElement("div",{style:{flex:"2 1 110px"}},

        React.createElement("span",{style:{fontSize:12,color:STN,marginLeft:6}},"×"+p.qty),

      ),
      SIZES[szKey]&&React.createElement("span",{className:"badge",style:{background:BG,color:MID,border:"1px solid "+MUT,fontWeight:600}},szKey+" · "+units+" Einh."),
      !p.done&&React.createElement("div",{style:{display:"flex",alignItems:"center",gap:2,flex:"3 1 260px",overflowX:"auto"}},
        STAGES.map((st,i)=>{
          const done2=i<idx,act=i===idx;
          return React.createElement("div",{key:st.id,style:{display:"flex",alignItems:"center"}},
            React.createElement("button",{onClick:()=>onMove(p.id,st.id),style:{padding:"3px 6px",borderRadius:4,fontSize:9,fontWeight:act?700:400,whiteSpace:"nowrap",background:act?INK:done2?MUT:BG,color:act?WHT:done2?MID:STN,border:"1px solid "+(act?INK:MUT),cursor:"pointer"}},st.short+(done2?" ✓":"")),
            i<STAGES.length-1&&React.createElement("div",{style:{width:5,height:1,background:done2?MUTDK:MUT,flexShrink:0}})
          );

      !p.done&&React.createElement("div",{style:{display:"flex",gap:4,marginLeft:"auto",flexShrink:0}},
        React.createElement("button",{className:"btn",disabled:idx===0,onClick:()=>onMove(p.id,SIDS[idx-1])},"◂"),
        React.createElement("button",{className:"btn",disabled:idx===SIDS.length-1,onClick:()=>onMove(p.id,SIDS[idx+1])},"▸")

    p.note&&React.createElement("p",{style:{fontSize:11,color:STN,fontStyle:"italic",marginTop:5,paddingLeft:26}},"↳ "+p.note)

// ── ORDER FORM ────────────────────────────────────────
function OrderForm({init,s,onSave,onCancel}){

// ── OVEN VIEW ─────────────────────────────────────────
function OvenView({orders,s}){
  const cS=s.ovenCapSchueh,cG=s.ovenCapGlasur;
  const COLS=["#8C6E50","#5C8070","#506E8C","#7A5870","#8C7A50","#6E7A50","#7A506E"];
  const all=orders.flatMap(o=>o.products.filter(p=>!p.done&&STAGES.find(st=>st.id===p.stage)&&STAGES.find(st=>st.id===p.stage).oven).map(p=>({...p,kunde:o.kunde,delivery:o.delivery,units:ovenUnits(p)}))).sort((a,b)=>a.delivery.localeCompare(b.delivery));
  const sch=all.filter(p=>p.stage==="schuehbrand");
  const g1=all.filter(p=>p.stage==="glasurbrand"&&(p.glasurTemp||"1240")==="1100");

      bs.map((b,i)=>{
        const pct=Math.min(100,(b.used/cap)*100),full=b.used>=cap*0.95,soon=b.items.map(p=>p.delivery).sort()[0];
        return React.createElement("div",{key:i,style:{background:WHT,border:"1px solid "+(full?col:MUT),borderLeft:"3px solid "+col,borderRadius:8,padding:"13px 15px",marginBottom:10}},
          React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},

          ),
          React.createElement("p",{style:{fontSize:11,color:STN,marginBottom:8}},"Frühester Termin: "+React.createElement("strong",{style:{color:INK}},soon)),
          b.items.map((p,j)=>{
            const sk=(p.groesse||"M").toUpperCase();
            const tu=(p.qty*(SIZES[sk]||1.5));
            return React.createElement("div",{key:j,style:{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderTop:"1px solid "+BG,fontSize:12}},
              React.createElement("div",{style:{width:8,height:8,borderRadius:2,background:COLS[j%COLS.length],flexShrink:0}}),

    React.createElement("div",{style:{padding:"8px 28px 36px",textAlign:"center"}},
      React.createElement("p",{style:{fontSize:10,letterSpacing:3,color:MUTDK,textTransform:"uppercase"}},"atelier mond · "+new Date().getFullYear())
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
